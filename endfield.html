<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>明日方舟：终末地 - 我的游戏档案</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-endfield">
  <div class="wrap">

    <div class="topbar">
      <div>
        <h1>明日方舟：终末地</h1>
        <div class="subtitle">ARKNIGHTS: ENDFIELD · 鹰角网络</div>
      </div>
      <a class="back" href="index.html">&lt;&lt; 返回主页</a>
    </div>

    <!-- ===== 板块导航条（滚动到对应板块会自动高亮） ===== -->
    <nav class="pagenav" id="pagenav">
      <a href="#facts">开拓信息</a>
      <a href="#notes">我的记录</a>
      <a href="#shots">截图墙</a>
    </nav>

    <div class="hero">
      <!-- 想换封面图：把图片放进 covers 文件夹，然后改成 <img src="covers/endfield.jpg"> -->
      <div class="poster" style="background:linear-gradient(135deg,#5e2b0b,#7a3a1a)">终</div>
      <div>
        <h2>塔卫二开拓手册</h2>
        <div class="en">终末地工业，开工。</div>
      </div>
    </div>

    <!-- ===== 开拓信息（这些信息直接改文字就行） ===== -->
    <section id="facts">
      <div class="sec-title">开拓信息</div>
      <div class="facts">
        <div class="fact">平台<b>PC / 手机</b></div>
        <div class="fact">状态<b>在玩</b></div>
        <div class="fact">开坑时间<b>2026-02</b></div>
        <div class="fact">基建进度<b>当前写：流水线刚成型</b></div>
      </div>
    </section>

    <!-- ===== 我的记录（加一条记录就复制一个 <li>...</li> 改内容） ===== -->
    <section id="notes">
      <div class="sec-title">我的记录</div>
      <ul class="notes">
        <li><span class="date">2026-11-21</span>矿场自动化终于跑通了，看着流水线发呆好解压。</li>
        <li><span class="date">2026-11-12</span>打了个Boss卡三天，回去先把装备升了。</li>
      </ul>
    </section>

    <!-- ===== 截图墙 ===== -->
    <section id="shots">
      <div class="sec-title">截图墙</div>
      <div class="shots">
        <!-- 想放截图：把图片放进 covers 文件夹，然后改成 <img src="covers/ef1.jpg"> -->
        <div class="shot">截图位 1（放 covers/ef1.jpg）</div>
        <div class="shot">截图位 2（放 covers/ef2.jpg）</div>
        <div class="shot">截图位 3（放 covers/ef3.jpg）</div>
      </div>
    </section>

    <footer>明日方舟：终末地 · 个人记录页</footer>
  </div>

  <script>
    // ==================== 导航条滚动高亮 ====================
    const navLinks = [...document.querySelectorAll("#pagenav a")];
    const secIO = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) {
        navLinks.forEach(l => l.classList.toggle("active", l.hash === "#" + e.target.id));
      }
    }), { rootMargin: "-25% 0px -65% 0px" });
    document.querySelectorAll("section[id]").forEach(s => secIO.observe(s));
  </script>
</body>
</html>
