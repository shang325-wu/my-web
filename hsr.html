<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>崩坏：星穹铁道 - 我的游戏档案</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-hsr">
  <div class="wrap">

    <div class="topbar">
      <div>
        <h1>崩坏：星穹铁道</h1>
        <div class="subtitle">HONKAI: STAR RAIL · 米哈游</div>
      </div>
      <a class="back" href="index.html">&lt;&lt; 返回主页</a>
    </div>

    <!-- ===== 板块导航条（滚动到对应板块会自动高亮） ===== -->
    <nav class="pagenav" id="pagenav">
      <a href="#facts">列车信息</a>
      <a href="#notes">我的记录</a>
      <a href="#shots">截图墙</a>
    </nav>

    <div class="hero">
      <!-- 想换封面图：把图片放进 covers 文件夹，然后改成 <img src="covers/hsr.jpg"> -->
      <div class="poster" style="background:linear-gradient(135deg,#0b3a5e,#3a1a7a)">星</div>
      <div>
        <h2>银河搭车指南</h2>
        <div class="en">愿此行，终抵群星。</div>
      </div>
    </div>

    <!-- ===== 列车信息（这些信息直接改文字就行） ===== -->
    <section id="facts">
      <div class="sec-title">列车信息</div>
      <div class="facts">
        <div class="fact">平台<b>手机 / PC</b></div>
        <div class="fact">状态<b>在玩</b></div>
        <div class="fact">开坑时间<b>2024-06</b></div>
        <div class="fact">主力队<b>当前写：开拓者队</b></div>
      </div>
    </section>

    <!-- ===== 我的记录（加一条记录就复制一个 <li>...</li> 改内容） ===== -->
    <section id="notes">
      <div class="sec-title">我的记录</div>
      <ul class="notes">
        <li><span class="date">2026-11-20</span>新版本开了，先清完主线剧情再说抽卡的事。</li>
        <li><span class="date">2026-11-10</span>模拟宇宙又出了快乐流，玩到停不下来。</li>
      </ul>
    </section>

    <!-- ===== 截图墙 ===== -->
    <section id="shots">
      <div class="sec-title">截图墙</div>
      <div class="shots">
        <!-- 想放截图：把图片放进 covers 文件夹，然后改成 <img src="covers/hsr1.jpg"> -->
        <div class="shot">截图位 1（放 covers/hsr1.jpg）</div>
        <div class="shot">截图位 2（放 covers/hsr2.jpg）</div>
        <div class="shot">截图位 3（放 covers/hsr3.jpg）</div>
      </div>
    </section>

    <footer>崩坏：星穹铁道 · 个人记录页</footer>
  </div>

  <script>
    // ==================== 导航条滚动高亮 ====================
    const navLinks = [...document.querySelectorAll("#pagenav a")];
    const secIO = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) {
        navLinks.forEach(l => l.classList.toggle("active", l.hash === "#" + e.target.id));
      }
    }), { rootMargin: "-25% 0px -65% 0px" });
    document.querySelectorAll("section[id]").forEach(s => secIO.observe(s));
  </script>
</body>
</html>
